name: Sync GitHub Document

on:
  schedule:
    # 北京时间 9:00 和 23:00
    - cron: '0 1 * * *'   # UTC 01:00 = CST 09:00
    - cron: '0 15 * * *'  # UTC 15:00 = CST 23:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Sync article from GitHub
        run: python backend/scripts/sync.py

      - name: Push changes
        run: |
          # 使用你本人身份提交（计入个人 contributions）
          git config --local user.name "ok406lhq"
          git config --local user.email "22291214+ok406lhq@users.noreply.github.com"

          git add frontend/public/data/article.json frontend/public/data/camo_cache.json || true
          if ! git diff --staged --quiet; then
            git commit -m "docs: auto-update article"
            git push
          else
            echo "No changes to commit"
          fi